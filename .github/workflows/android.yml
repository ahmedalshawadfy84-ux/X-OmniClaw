name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Fix line endings for gradlew
      run: sed -i 's/\r$//' gradlew

    - name: Generate Dummy Keystore
      run: |
        keytool -genkey -v -keystore keystore.jks -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
        cp keystore.jks ../keystore.jks
        cp keystore.jks app/keystore.jks || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug
